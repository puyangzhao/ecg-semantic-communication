# Phase 2A: budget-aware lead selection, clean channel only.
# One config shared by all 5 conditions (random_k, fixed_clinical_k,
# global_learned_k, proposed, ceiling_k12); --method and --seed select the
# run. See docs/phase2a_design.md.
embeddings_dir: outputs/phase2a/embeddings
budgets: [1, 3, 6]   # ceiling_k12 overrides this to [12] internally
d: 32

model:
  classifier_hidden_dim: null
  dropout: 0.1

train:
  batch_size: 64
  num_epochs: 60
  lr: 0.001
  weight_decay: 0.0001
  device: cpu
  early_stopping_patience: 10

eval:
  threshold: 0.5
  n_bootstrap: 2000
