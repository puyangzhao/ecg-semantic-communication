# K=1 two-way gate pilot (A vs B) -- PRE-SPECIFIED before any gate result was computed.
# Clean Phase 2A, seed 0, CPU only. Fold 9 = development evaluation. test.pt and external data never loaded.
seed: 0
device: cpu
paths:
  A: "proposed head (outputs/runs/phase2a_proposed_seed0) + selector top-1 candidate lead"
  B: "same proposed head + V5 forced"
  C: "matched fixed-V5 head (revision_audit/fixed_v5/outputs/runs/fixed_k1V5_seed0) + V5 -- independent deployment baseline, not a gate arm"
switchable: "records whose selector candidate lead != V5; candidate==V5 records always use V5 and are excluded from the switch denominator"
oof_training:
  inner_folds: [1, 2, 3, 4, 5, 6, 7, 8]          # PTB-XL strat_folds, patient-disjoint (verified)
  early_stopping_fold_for_heldout_k: "k % 8 + 1"  # epoch selection never sees held-out-fold patients
  recipe: "scripts/train_phase2a.py::main --method proposed, configs/phase2a.yaml with device=cpu (otherwise identical)"
  encoder_caveat: "frozen encoder (baseline_run1) was trained on folds 1-8 and early-stopped on fold 9: OOF applies to selector/head only, conditional on the original frozen encoder"
fold9_predictions: "original proposed seed0 checkpoint (A, B) and fixed-V5 seed0 (C); identical to round-3 saved logits"
target:
  definition: "per switchable record and class c: BCE_c(B) - BCE_c(A), plain (unweighted) binary cross-entropy from logits against the true label; > 0 means switching to the candidate helps"
  classes: [NORM, MI, STTC, CD, HYP]
features:
  - "z_V5 (32 dims)"
  - "z_candidate (32 dims)"
  - "candidate lead ID one-hot (12 columns)"
  - "selector top-1 minus top-2 raw score"
feature_standardization: "z-score, mean/std fit on the training (OOF folds 1-8) switchable records only"
gate_model:
  type: "multi-output ridge regression (sklearn.linear_model.Ridge), intercept on"
  alpha: 10.0          # fixed, not tuned
score_definitions:
  equal: "mean of the 5 predicted gains"
  sttc_weighted: "(NORM + MI + 2*STTC + CD + HYP) / 6"
budgets_fraction_of_switchable: [0.25, 0.50, 0.75]
primary_budget: 0.50
policies:
  gate_rank_matched: "on fold 9, switch the top round(q * n_switchable) switchable records by score"
  gate_fixed_threshold: "threshold = (1-q) quantile of the score over TRAINING switchable records (in-sample ridge predictions); applied record-by-record on fold 9; actual switch rate reported"
  margin_rank_matched: "switch the top round(q * n) switchable records by selector top1-top2 margin, descending"
  margin_fixed_threshold: "same training-quantile rule applied to the margin"
  random: "uniformly random switch set of the same size, 200 repetitions (rng 20261104), metrics computed per repetition then averaged"
endpoints: {"0%": "B everywhere (must reproduce round-3 B)", "100%": "A everywhere (must reproduce round-3 A)", "C": "independent"}
metrics: "macro + per-class AUROC/AUPRC on the FULL fold 9 (2183 records), sklearn"
no_post_hoc_tuning: "weights, alpha, budgets, features fixed; not revised after seeing fold-9 results"
