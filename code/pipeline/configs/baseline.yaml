# Phase 1 clean-channel baseline config.
seed: 42

data:
  root: data/ptbxl          # relative to repo root; symlink to a local PTB-XL 1.0.3 100Hz install (see README.md "Data")
  sampling_rate: 100
  signal_length: 1000
  num_leads: 12
  filename_col: filename_lr
  norm_stats_path: outputs/norm_stats.npz

model:
  latent_dim: 32
  base_channels: 16
  num_blocks: 3
  fusion: mean               # mean | attention
  classifier_hidden_dim: null
  dropout: 0.1

train:
  batch_size: 64
  num_epochs: 30
  lr: 0.001
  weight_decay: 0.0001
  num_workers: 4
  device: cuda                # overridden to cpu for CPU smoke test
  early_stopping_patience: 8
  checkpoint_dir: outputs/checkpoints/baseline
  log_path: outputs/logs/baseline.log

eval:
  threshold: 0.5              # decision threshold for F1 (AUROC is threshold-free)
