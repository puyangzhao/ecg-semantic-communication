# Phase 2B validation-only pilot: K=1, AWGN only, seed=0 only.
# Reuses Phase 2A's cached frozen-encoder embeddings (same encoder, same cache).
seed: 0
embeddings_dir: outputs/phase2a/embeddings
d: 32
snr_grid_db: [-5, 0, 5, 10, 15, 20]

model:
  classifier_hidden_dim: null
  dropout: 0.1

train:
  batch_size: 64
  num_epochs: 40
  lr: 0.001
  weight_decay: 0.0001
  device: cuda
  early_stopping_patience: 8

eval:
  threshold: 0.5
